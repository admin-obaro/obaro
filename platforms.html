<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="obaro — external portals directory across streaming platforms, social channels, and store links.">
    <title>obaro — external portals</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #000000;
            --dim: #666666;
            --accent: #d90429;
            --accent-glow: rgba(217, 4, 41, 0.6);
            --border: #e5e5e5;
            --font: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --text: #ffffff;
                --dim: #888888;
                --accent: #ff2a2a;
                --accent-glow: rgba(255, 42, 42, 0.7);
                --border: #222222;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font);
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.4;
            font-size: 0.85rem;
            padding: 40px 0;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
        }

        header {
            margin-bottom: 40px;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 12px;
            text-transform: lowercase;
        }

        h1 span {
            color: var(--accent);
        }

        .back-link {
            color: var(--dim);
            text-decoration: none;
            display: inline-block;
            margin-bottom: 30px;
        }

        .back-link:hover {
            color: var(--accent);
            text-decoration: underline;
        }

        .platform-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 60px;
        }

        .platform-list a {
            color: var(--text);
            text-decoration: none;
            font-size: 0.9rem;
            width: fit-content;
        }

        .platform-list a:hover {
            color: var(--accent);
            text-decoration: underline;
        }

        .fallback-link {
            color: var(--dim) !important;
            font-size: 0.82rem !important;
            margin-top: 10px;
        }

        footer {
            padding-top: 20px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            color: var(--dim);
        }

        footer a {
            color: inherit;
            text-decoration: none;
        }

        footer a:hover {
            color: var(--accent);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>obaro — <span>external portals</span></h1>
            <a href="index.html" class="back-link">dear rhea,</a>
        </header>

        <main class="platform-list">
            <a href="https://music.apple.com" target="_blank" rel="noopener noreferrer">apple music</a>
            <a href="https://audiomack.com" target="_blank" rel="noopener noreferrer">audiomack</a>
            <a href="https://bandcamp.com" target="_blank" rel="noopener noreferrer">bandcamp</a>
            <a href="https://boomplay.com" target="_blank" rel="noopener noreferrer">boomplay</a>
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">instagram</a>
            <a href="https://open.spotify.com" target="_blank" rel="noopener noreferrer">spotify</a>
            <a href="https://tiktok.com" target="_blank" rel="noopener noreferrer">tiktok</a>
            <a href="https://x.com" target="_blank" rel="noopener noreferrer">x</a>
            <a href="https://youtube.com" target="_blank" rel="noopener noreferrer">youtube</a>
            
            <!-- Universal Fallback: Auto-routes 140+ global stores (Deezer, Tidal, Amazon, etc.) -->
            <a href="https://song.link/YOUR_SPOTIFY_OR_ISRC_LINK" target="_blank" rel="noopener noreferrer" class="fallback-link">all other stores</a>
        </main>

        <footer>
            <span>obaro</span>
            <a href="index.html">dear rhea,</a>
        </footer>
    </div>

</body>
</html>
